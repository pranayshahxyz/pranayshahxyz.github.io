<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Pranay Shah">
    <meta name="author" content="Pranay Shah">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="Pranay Shah">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pranayshah.xyz">
    <meta property="og:description" content="Pranay Shah">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Pranay Shah">
    <title>Pranay Shah</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#000000">
    <style>
:root {
    --bg: light-dark(#fff, #000);
    --text: light-dark(#000, #fff);
    --muted: light-dark(#3c3c4399, #ebebf599);
    --accent: light-dark(#007aff, #0a84ff);
    --focus-ring: light-dark(#007aff66, #0a84ff66);
    --type: clamp(1.375rem, 0.85rem + 2.2vw, 2rem);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    color-scheme: light dark;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    height: 100%;
}

body {
    margin: 0;
    min-height: 100%;
    min-height: 100dvh;
    padding:
        max(2rem, calc(env(safe-area-inset-top, 0px) + 1.25rem))
        max(1.5rem, calc(env(safe-area-inset-right, 0px) + 1rem))
        max(2rem, calc(env(safe-area-inset-bottom, 0px) + 1.25rem))
        max(1.5rem, calc(env(safe-area-inset-left, 0px) + 1rem));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-optical-sizing: auto;
    font-size: var(--type);
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

main {
    width: min(100%, 22rem);
}

h1 {
    margin: 0 0 0.35em;
    font-size: 1em;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.022em;
}

nav {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.12em;
}

a {
    display: inline-flex;
    align-items: center;
    min-height: 1.35em;
    padding: 0.2em 0;
    margin-inline: -0.15em;
    padding-inline: 0.15em;
    color: var(--muted);
    text-decoration: none;
    border-radius: 0.2em;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition:
        color 0.22s var(--ease-out),
        background-color 0.22s var(--ease-out);
}

a:hover {
    color: var(--accent);
}

a:active {
    color: var(--accent);
    opacity: 0.82;
}

a:focus-visible {
    color: var(--accent);
    background-color: var(--focus-ring);
    box-shadow: 0 0 0 0.2em var(--focus-ring);
}

::selection {
    background: light-dark(#007aff33, #0a84ff55);
    color: var(--text);
}

h1,
nav a {
    animation: in 0.75s var(--ease-out) both;
}

nav a:nth-child(1) { animation-delay: 0.05s; }
nav a:nth-child(2) { animation-delay: 0.09s; }
nav a:nth-child(3) { animation-delay: 0.13s; }
nav a:nth-child(4) { animation-delay: 0.17s; }

@keyframes in {
    from {
        opacity: 0;
        transform: translateY(0.4em);
    }
}

@media (min-width: 48rem) {
    body {
        padding:
            max(2.5rem, calc(env(safe-area-inset-top, 0px) + 2rem))
            max(3rem, 8vw)
            max(2.5rem, calc(env(safe-area-inset-bottom, 0px) + 2rem))
            max(3rem, 8vw);
    }

    main {
        width: min(100%, 28rem);
    }
}

@media (hover: none) and (pointer: coarse) {
    a {
        min-height: 2.75rem;
        padding-block: 0.35rem;
    }

    nav {
        gap: 0.05em;
    }
}

@media (prefers-reduced-motion: reduce) {
    h1,
    nav a {
        animation: none;
    }

    a {
        transition: none;
    }
}

</style>
</head>
<body>
    <main>
        <h1>Pranay Shah</h1>
        <nav aria-label="Links">
            <a href="mailto:pranay@pranayshah.xyz">Email</a>
            <a href="https://x.com/pranayshah" rel="noopener noreferrer">𝕏</a>
            <a href="https://linkedin.com/in/pranayshahxyz" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://instagram.com/pranayshahxyz" rel="noopener noreferrer">Instagram</a>
        </nav>
    </main>
</body>
</html>
